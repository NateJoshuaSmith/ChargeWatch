services:
  db:
    image: postgres:18
    # Local development only. These credentials must never be used elsewhere.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 declares its volume at /var/lib/postgresql.
      # The cluster lives in /var/lib/postgresql/18/docker inside that mount.
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "${POSTGRES_USER:?POSTGRES_USER is required in .env}",
          "-d",
          "${POSTGRES_DB:?POSTGRES_DB is required in .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
